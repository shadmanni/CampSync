<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CampusSync — one app for everything that happens on campus. Verified student feed, marketplace, carpools and local deals." />
    <meta name="theme-color" content="#FDFBF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0B10" media="(prefers-color-scheme: dark)" />
    <title>CampusSync — One app for the whole campus</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236E56F8'/%3E%3Ctext x='50' y='70' font-size='58' font-family='system-ui' font-weight='800' fill='%23fff' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Always open in light mode ("Campus Pop") by default.
      // Only honour a saved preference if the user explicitly toggled.
      (function () {
        try {
          var saved = localStorage.getItem('campussync_theme');
          document.documentElement.dataset.theme = saved || 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
